<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Black Dealer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: black ground, white accents. Sticky top bar (logo, nav, account). Verkauf = searchable collapsible catalog left, Beleg right (stacks on phones with a sticky total bar). */
:root{
  --bg:#050505; --surface:#101010; --surface2:#1a1a1a; --line:#2c2c2c;
  --fg:#f2f2f2; --muted:#8f8f8f; --accent:#ffffff; --accent-fg:#050505; --bad:#ff6b5e;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:3px;padding-bottom:8px}
.brand img{height:34px;width:auto;display:block}
.brand small{font:600 10px/1 var(--body);letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.who{display:flex;gap:8px;align-items:center;padding-bottom:8px;font-size:13px;color:var(--muted)}
.who b{color:var(--fg)}
nav{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;max-width:100%;flex:1 1 100%;order:3}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 14px var(--body);padding:9px 12px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
nav button:hover{color:var(--fg)}
nav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:22px}
h1{font:700 34px/1.05 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 6px;text-wrap:balance}
h2{font:700 22px/1.1 var(--display);letter-spacing:.05em;text-transform:uppercase;margin:28px 0 10px}
h3{font:700 17px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;color:var(--muted)}
.lead{color:var(--muted);max-width:68ch;margin:0 0 18px}
.status{font-size:12px;color:var(--muted);margin:0 0 14px}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px}
.status i.off{background:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.cat{padding:0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--fg);font:inherit;padding:14px 16px;cursor:pointer;text-align:left}
.cat-h:hover{background:var(--surface2)}
.cat-h .t{font:700 19px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;flex:1;min-width:0}
.cat-h .t small{font:500 12px var(--body);letter-spacing:.04em;text-transform:none;color:var(--muted);margin-left:8px}
.cat-h .cnt{font-size:12px;color:var(--muted)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:4px}
.cat.open .chev{transform:rotate(45deg)}
.cat-b{padding:0 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.chip{position:relative;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:10px 10px 9px;cursor:pointer;color:var(--fg);font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0;user-select:none}
.chip:hover{border-color:var(--muted)}
.chip .n{font-weight:600;overflow-wrap:anywhere;padding-right:30px}
.chip .p{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.chip .b{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font:700 13px/24px var(--body);text-align:center;display:none;padding:0 6px;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip.on .b{display:block}
.chip .x{position:absolute;right:6px;bottom:6px;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:3px;width:26px;height:24px;font-size:16px;line-height:1;cursor:pointer;display:none;padding:0}
.chip.on .x{display:block}
.beleg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
@media(max-width:860px){.beleg{position:static}}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.line.total{border-bottom:0;border-top:2px solid var(--fg);margin-top:6px;padding-top:10px;font:700 26px var(--display);letter-spacing:.03em}
.cl{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px 26px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.cl .nm{overflow-wrap:anywhere}
.cl input{padding:5px 6px;text-align:right}
.cl .sm{text-align:right;white-space:nowrap}
.cl button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:3px;cursor:pointer;width:26px;height:26px;padding:0}
.muted{color:var(--muted)}
label.f{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=password],input[type=number],select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font:inherit;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:7px 10px;font:600 13px var(--body);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:4px;padding:11px 16px;font:700 15px var(--body);letter-spacing:.03em;cursor:pointer}
.btn:hover{filter:brightness(.88)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.full{width:100%;margin-top:14px}
.notes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.postit{background:var(--surface2);border:1px solid var(--fg);color:var(--fg);padding:10px 12px;border-radius:2px;max-width:230px}
.postit b{display:block;font:700 15px var(--display);letter-spacing:.08em;text-transform:uppercase}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi h3{margin-bottom:4px;font-size:14px}
.kpi div{font:700 26px/1.1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.hot{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{flex:1 1 180px;min-width:0}
.row>.btn{flex:0 0 auto}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:600;z-index:9;max-width:90vw}
.vk{width:130px;text-align:right}
.login{max-width:400px;margin:6vh auto 0;text-align:center}
.login img{width:min(320px,80%);height:auto;display:block;margin:0 auto 6px}
.login .sub{font:600 11px/1 var(--body);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:28px}
.login .card{text-align:left}
.err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:1em}
.cartbar{display:none}
@media(max-width:860px){
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--accent);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;align-items:center;justify-content:space-between}
  .cartbar b{font:700 22px var(--display);font-variant-numeric:tabular-nums}
  body{padding-bottom:80px}
}
</style>

/* ---------- Passwörter ---------- */
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function b64d(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:150000,hash:'SHA-256'},key,256);
  return b64e(new Uint8Array(bits));
}
function newSalt(){return b64e(crypto.getRandomValues(new Uint8Array(16)))}
async function makeCred(pw){var salt=newSalt();return {salt:salt,hash:await hashPw(pw,salt)}}

function priceOf(id){var p=S.data.prices.filter(function(x){return x.id===id})[0];return p&&typeof p.price==='number'?p.price:SVC[id].price}
function save(col,id,obj){
  if(db){return db.collection(col).doc(id).set(obj).catch(function(e){toast('Speichern nicht möglich ('+(e&&e.code||'Fehler')+')')})}
  var list=S.data[col],o=Object.assign({id:id},obj),i=list.findIndex(function(x){return x.id===id});
  if(i>=0)list[i]=o;else list.push(o);syncMe();render();return Promise.resolve();
}
function remove(col,id){
  if(db){return db.collection(col).doc(id).delete().catch(function(e){toast('Löschen nicht möglich ('+(e&&e.code||'Fehler')+')')})}
  S.data[col]=S.data[col].filter(function(x){return x.id!==id});syncMe();render();return Promise.resolve();
}
function strip(o){var c=Object.assign({},o);delete c.id;return c}
function memberById(id){return S.data.members.filter(function(m){return m.id===id})[0]}
/* hält die angemeldete Person aktuell; wirft sie raus, wenn sie deaktiviert oder gelöscht wurde */
function syncMe(){
  if(!S.me)return;
  var m=memberById(S.me.id);
  if(!m||m.active===false){S.me=null;try{localStorage.removeItem(SESSION)}catch(e){}return}
  S.me=m;
}
async function initDb(){
  try{ if(window.claude&&window.claude.use){dl=await window.claude.use('downloads');db=await window.claude.use('db');} }catch(e){db=db||null}
  if(!db){S.booted=true;render();return}
  S.shared=true;
  var first={};
  Object.keys(S.data).forEach(function(col){
    db.collection(col).onSnapshot(function(snap){
      S.data[col]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      if(col==='members'){
        if(!S.me&&!first.members){var id=null;try{id=localStorage.getItem(SESSION)}catch(e){}var m=id&&memberById(id);if(m&&m.active!==false)S.me=m}
        syncMe();
      }
      first[col]=true;
      if(first.members)S.booted=true;
      softRender();
    },function(){S.shared=false;S.booted=true;render()});
  });
}
function softRender(){
  var a=document.activeElement;
  if(a&&$main.contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)){pending=true;return}
  render();
}
document.addEventListener('focusout',function(){if(pending){pending=false;setTimeout(render,0)}});

function calc(){
  var lines=[],sub=0,count=0;
  Object.keys(S.cart).forEach(function(id){var q=S.cart[id];if(q>0&&SVC[id]){var p=priceOf(id);lines.push({id:id,name:SVC[id].name,qty:q,price:p});sub+=p*q;count+=q}});
  var total=Math.round(sub*(1-S.disc/100)*100)/100;
  return {lines:lines,sub:sub,total:total,count:count};
}
function sellerName(s){return s.sellerName||(memberById(s.seller)||{}).display||'–'}

/* ---------- PDF ---------- */
function belegNo(s){return String(s.id||'').slice(-6).toUpperCase()}
function makePdf(s){
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J)return Promise.reject(new Error('nolib'));
  var d=new J({unit:'mm',format:'a4'}),W=210,M=16,R=W-M,y=0;
  var cols={q:128,p:158,s:R};
  function band(){
    d.setFillColor(5,5,5);d.rect(0,0,W,34,'F');
    try{d.addImage(LOGO,'PNG',M,8,58,58*279/900)}catch(e){}
    d.setTextColor(255,255,255);d.setFont('helvetica','normal');d.setFontSize(8);d.text('Z-DAY · THE LAST STAND',R,21,{align:'right'});
  }
  function thead(){
    d.setTextColor(110,110,110);d.setFont('helvetica','bold');d.setFontSize(8);
    d.text('ARTIKEL',M,y);d.text('MENGE',cols.q,y,{align:'right'});d.text('EINZELPREIS',cols.p,y,{align:'right'});d.text('SUMME',cols.s,y,{align:'right'});
    d.setDrawColor(20,20,20);d.setLineWidth(.4);d.line(M,y+2,R,y+2);y+=8;
  }
  band();
  d.setTextColor(20,20,20);d.setFont('helvetica','bold');d.setFontSize(22);d.text('BELEG',M,50);
  d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(90,90,90);
  d.text('Nr. '+belegNo(s),R,50,{align:'right'});
  var meta=[['Datum',dt(s.ts)],['Verkäufer',s.sellerName||'–'],['Kunde',s.customer||'–']];
  y=60;meta.forEach(function(m){d.setFont('helvetica','bold');d.setTextColor(110,110,110);d.setFontSize(8);d.text(m[0].toUpperCase(),M,y);d.setFont('helvetica','normal');d.setTextColor(20,20,20);d.setFontSize(10);d.text(String(m[1]),M+28,y);y+=6});
  y+=8;thead();
  (s.lines||[]).forEach(function(l){
    var nm=d.splitTextToSize(l.name,88),h=Math.max(6,nm.length*5+1);
    if(y+h>268){d.addPage();band();y=48;thead()}
    d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(20,20,20);
    d.text(nm,M,y);
    d.text(String(l.qty),cols.q,y,{align:'right'});d.text(gn(l.price),cols.p,y,{align:'right'});d.text(gn(l.price*l.qty),cols.s,y,{align:'right'});
    y+=h;d.setDrawColor(215,215,215);d.setLineWidth(.2);d.line(M,y-3.6,R,y-3.6);
  });
  if(y+38>280){d.addPage();band();y=48}
  y+=4;
  function tl(label,val,bold){d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(bold?14:10);d.setTextColor(20,20,20);d.text(label,cols.p-34,y);d.text(val,R,y,{align:'right'});y+=bold?9:6}
  tl('Zwischensumme',gn(s.sub));
  if(s.disc)tl('Rabatt ('+s.disc+' %)','-'+gn(s.sub-s.total));
  d.setDrawColor(20,20,20);d.setLineWidth(.6);d.line(cols.p-34,y-2.5,R,y-2.5);y+=3;
  tl('GESAMT',gn(s.total),true);
  var n=d.getNumberOfPages();
  for(var i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(130,130,130);d.text('Black Dealer · Beleg '+belegNo(s)+' · Seite '+i+' von '+n,W/2,289,{align:'center'})}
  return Promise.resolve(d.output('blob'));
}

  var m=canManage();
  var list=S.data.notes.slice().sort(function(a,b){return (b.important?1:0)-(a.important?1:0)||(b.ts||0)-(a.ts||0)});
  var h='<h1>Notizen</h1><p class="lead">Gemeinsamer Notizzettel fürs Team. Wichtige Notizen erscheinen als Post-it auf der Verkaufsmaske.</p>'+statusLine();
  h+='<div class="card"><h3>Neue Notiz</h3><div class="row"><div><label class="f" for="nl" style="margin-top:0">Bezeichnung</label><input type="text" id="nl" placeholder="z. B. Discord, Kunde XY"></div><div style="flex:2 1 260px"><label class="f" for="nt" style="margin-top:0">Beschreibung / Wert</label><input type="text" id="nt"></div>'+(m?'<div style="flex:0 0 auto"><label class="f" style="margin-top:0"><input type="checkbox" id="ni" style="margin-right:6px">Wichtig</label></div>':'')+'<button type="button" class="btn" data-act="noteadd">Hinzufügen</button></div></div>';
  if(!list.length)return h+'<div class="card empty">Noch keine Notizen.</div>';
  h+='<div class="card">'+list.map(function(n){return '<div class="line" style="flex-wrap:wrap"><span style="min-width:0;overflow-wrap:anywhere">'+(n.important?'<span class="pill on">wichtig</span> ':'')+'<b>'+esc(n.label)+':</b> '+esc(n.text)+'</span><span style="display:flex;gap:6px;flex-wrap:wrap">'+(m?'<button class="btn sm sec" data-act="noteimp" data-id="'+n.id+'">'+(n.important?'Nicht mehr wichtig':'Wichtig')+'</button>':'')+'<button class="btn sm sec" data-act="notecopy" data-id="'+n.id+'">Kopieren</button>'+(m?'<button class="btn sm sec" data-act="notedel" data-id="'+n.id+'">Löschen</button>':'')+'</span></div>'}).join('')+'</div>';
  return h;
}
function vPrices(){
  var h='<h1>Preise</h1><p class="lead">Hier passt du den Preis pro Artikel an. Geänderte Preise gelten für neue Verkäufe, alte Belege bleiben unverändert.</p>'+statusLine();
  CATS.forEach(function(c){
    var key='price:'+c[0],open=!!S.open[key];
    h+='<div class="card cat'+(open?' open':'')+'">'+catHead(c,key,c[4].length,0);
    if(open){
      h+='<div class="cat-b tablewrap"><table><thead><tr><th>Artikel</th><th class="num">Standard</th><th class="num">Preis ('+CUR+')</th></tr></thead><tbody>';
      c[4].forEach(function(s){var v=priceOf(s.id);
        h+='<tr><td>'+esc(s.name)+'</td><td class="num muted">'+gn(s.price)+'</td><td class="num"><input class="vk" type="number" step="0.01" min="0" id="p-'+s.id+'" data-id="'+s.id+'" value="'+v+'" aria-label="Preis '+esc(s.name)+'"></td></tr>';
      });
      h+='</tbody></table></div>';
    }
    h+='</div>';
  });
  return h+'<div class="row" style="justify-content:flex-start"><button type="button" class="btn" data-act="pricesave">Preise speichern</button><button type="button" class="btn sec" data-act="pricereset">Auf Standard zurücksetzen</button></div>';
}
function rankSelect(id,cur,dataIn){
  return '<select '+(id?'id="'+id+'" ':'')+(dataIn?'data-in="'+dataIn+'" ':'')+'aria-label="Rang">'+RANKS.map(function(r){return '<option value="'+r[0]+'"'+(r[0]===cur?' selected':'')+'>'+esc(r[1])+'</option>'}).join('')+'</select>';
}
function vTeam(){
  var h='<h1>Mitarbeiter</h1><p class="lead">Hier legst du Zugänge an und vergibst Ränge. Nur der Black Boss darf Preise und Mitarbeiter verwalten.</p>'+statusLine();
  h+='<div class="card"><h3>Neuen Mitarbeiter anlegen</h3><div class="row"><div><label class="f" for="nu" style="margin-top:0">Benutzername</label><input type="text" id="nu" autocapitalize="none" autocomplete="off"></div><div><label class="f" for="nd" style="margin-top:0">Anzeigename</label><input type="text" id="nd" autocomplete="off"></div><div><label class="f" for="np" style="margin-top:0">Start-Passwort</label><input type="text" id="np" autocomplete="off" placeholder="mind. 6 Zeichen"></div><div style="flex:0 1 200px"><label class="f" for="nr" style="margin-top:0">Rang</label>'+rankSelect('nr',2)+'</div><button type="button" class="btn" data-act="staffadd">Anlegen</button></div></div>';
  var l=S.data.members.slice().sort(function(a,b){return (b.active!==false)-(a.active!==false)||b.rank-a.rank||a.display.localeCompare(b.display)});
  return h+'<div class="card tablewrap"><table><thead><tr><th>Name</th><th>Rang</th><th>Status</th><th>Neues Passwort</th><th></th></tr></thead><tbody>'+l.map(function(x){var a=x.active!==false,me=S.me.id===x.id;
    return '<tr><td><b>'+esc(x.display)+'</b><br><span class="muted">'+esc(x.username)+(me?' · du':'')+'</span></td><td>'+rankSelect('',x.rank,'rank" data-id="'+x.id)+'</td><td><span class="pill'+(a?' on':'')+'">'+(a?'aktiv':'inaktiv')+'</span></td><td><div style="display:flex;gap:6px"><input type="text" id="pw-'+x.id+'" placeholder="neues Passwort" autocomplete="off" style="min-width:120px"><button class="btn sm sec" data-act="staffpw" data-id="'+x.id+'">Setzen</button></div></td><td style="white-space:nowrap">'+(me?'':'<button class="btn sm sec" data-act="staffact" data-id="'+x.id+'">'+(a?'Deaktivieren':'Aktivieren')+'</button> <button class="btn sm sec'+(S.confirm===x.id?' danger':'')+'" data-act="staffdel" data-id="'+x.id+'">'+(S.confirm===x.id?'Wirklich löschen':'Löschen')+'</button>')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function vAccount(){
  return '<h1>Mein Konto</h1><p class="lead">Angemeldet als <b>'+esc(S.me.display)+'</b> ('+esc(S.me.username)+') mit dem Rang '+esc(rankName(S.me.rank))+'.</p><div class="card" style="max-width:420px"><h3>Passwort ändern</h3><form data-form="pw"><label class="f" for="o1" style="margin-top:0">Aktuelles Passwort</label><input type="password" id="o1" autocomplete="current-password" required><label class="f" for="o2">Neues Passwort (mind. 6 Zeichen)</label><input type="password" id="o2" autocomplete="new-password" required><label class="f" for="o3">Neues Passwort wiederholen</label><input type="password" id="o3" autocomplete="new-password" required><p class="err" id="lerr">'+esc(S.err)+'</p><button class="btn full" type="submit">Passwort ändern</button></form></div>';
}
var VIEWFN={sale:vSale,sales:vSales,notes:vNotes,prices:vPrices,team:vTeam,account:vAccount};

function allowed(v){var d=VIEWS.filter(function(x){return x[0]===v})[0];return v==='account'||(d&&(!d[2]||canManage()))}
function render(){
  var y=window.scrollY;
  if(!S.me){
    $nav.innerHTML='';$who.innerHTML='';$bar.hidden=true;
    $main.innerHTML=vLogin();
    return;
  }
  if(!allowed(S.view))S.view='sale';
  $nav.innerHTML=VIEWS.filter(function(v){return !v[2]||canManage()}).map(function(v){return '<button type="button" data-view="'+v[0]+'"'+(S.view===v[0]?' aria-current="page"':'')+'>'+v[1]+'</button>'}).join('');
  $who.innerHTML='<span><b>'+esc(S.me.display)+'</b> · '+esc(rankName(S.me.rank))+'</span><button type="button" class="btn sm sec" data-view="account">Konto</button><button type="button" class="btn sm sec" id="logout">Abmelden</button>';
  $main.innerHTML=VIEWFN[S.view]();
  if(S.view==='sale'){var c=calc();$bar.hidden=false;$bar.innerHTML='<span><span class="muted">'+c.count+' Artikel</span><br><b id="bar-total">'+gn(c.total)+'</b></span><button type="button" class="btn" data-act="gobeleg">Zum Beleg</button>'}
  else $bar.hidden=true;
  window.scrollTo(0,y);
}
function rerenderKeep(id){
  var pos=null,el=document.getElementById(id);if(el)pos=el.selectionStart;
  render();
  el=document.getElementById(id);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(x){}}
}
function updateTotals(){
  var c=calc();
  c.lines.forEach(function(l){var e=document.getElementById('ls-'+l.id);if(e)e.textContent=gn(l.price*l.qty)});
  var m={'s-count':String(c.count),'s-sub':gn(c.sub),'s-total':gn(c.total),'bar-total':gn(c.total)};
  Object.keys(m).forEach(function(k){var e=document.getElementById(k);if(e)e.textContent=m[k]});
}

/* ---------- Ereignisse ---------- */
function go(v){S.view=v;S.confirm='';S.err='';try{history.replaceState(null,'','#'+S.view)}catch(x){}render();window.scrollTo(0,0)}
document.querySelector('header.top').addEventListener('click',function(e){
  var b=e.target.closest('[data-view]');if(b)return go(b.dataset.view);
  if(e.target.closest('#logout')){S.me=null;S.cart={};S.done=null;S.err='';try{localStorage.removeItem(SESSION)}catch(x){}render()}
});
$bar.addEventListener('click',function(e){if(e.target.closest('[data-act="gobeleg"]')){var b=document.getElementById('beleg');if(b)b.scrollIntoView({behavior:'smooth',block:'start'})}});
function setQty(id,q){q=Math.max(0,Math.min(99999,Math.floor(q)||0));if(q)S.cart[id]=q;else delete S.cart[id];render()}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function setErr(t){S.err=t;var e=document.getElementById('lerr');if(e)e.textContent=t}
function normUser(u){return u.trim().toLowerCase()}

$main.addEventListener('submit',async function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form;
  try{
    if(k==='login'){
      var u=normUser(val('lu')),pw=document.getElementById('lp').value;
      var m=S.data.members.filter(function(x){return x.username===u&&x.active!==false&&x.hash})[0];
      var ok=false;
      if(m)ok=(await hashPw(pw,m.salt))===m.hash;
      else await hashPw(pw,newSalt());
      if(!ok)return setErr('Benutzername oder Passwort falsch.');
      S.me=m;S.err='';try{localStorage.setItem(SESSION,m.id)}catch(x){}
      S.view='sale';return render();
    }
    if(k==='setup'){
      var u2=normUser(val('lu')),d=val('ld'),p1=document.getElementById('lp').value,p2=document.getElementById('lp2').value;
      if(!/^[a-z0-9._-]{2,30}$/.test(u2))return setErr('Benutzername: 2 bis 30 Zeichen, nur Buchstaben a–z, Ziffern, Punkt, Bindestrich.');
      if(!d)return setErr('Bitte einen Anzeigenamen eingeben.');
      if(p1.length<6)return setErr('Das Passwort braucht mindestens 6 Zeichen.');
      if(p1!==p2)return setErr('Die Passwörter stimmen nicht überein.');
      var cr=await makeCred(p1),id='u_'+u2;
      await save('members',id,{username:u2,display:d,rank:6,active:true,salt:cr.salt,hash:cr.hash,ts:Date.now()});
      var mm=db?{id:id,username:u2,display:d,rank:6,active:true,salt:cr.salt,hash:cr.hash}:memberById(id);
      S.me=mm;S.err='';try{localStorage.setItem(SESSION,id)}catch(x){}
      S.view='sale';return render();
    }
    if(k==='pw'){
      var a=document.getElementById('o1').value,b=document.getElementById('o2').value,c=document.getElementById('o3').value;
      if((await hashPw(a,S.me.salt))!==S.me.hash)return setErr('Das aktuelle Passwort ist falsch.');
      if(b.length<6)return setErr('Das neue Passwort braucht mindestens 6 Zeichen.');
      if(b!==c)return setErr('Die neuen Passwörter stimmen nicht überein.');
      var cr2=await makeCred(b);
      await save('members',S.me.id,Object.assign(strip(S.me),cr2));
      S.err='';toast('Passwort geändert');render();
    }
  }catch(err){
    setErr(err&&err.message==='nocrypto'?'Anmeldung braucht eine sichere Verbindung (https).':'Das hat nicht geklappt. Bitte erneut versuchen.');
  }
});

$main.addEventListener('click',async function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='donex'){S.done=null;return render()}
  if(a==='pdf'){
    var sl=(S.done&&S.done.id===id)?S.done:S.data.sales.filter(function(x){return x.id===id})[0];if(!sl||!dl)return;
    try{var blob=await makePdf(sl);await dl.save({filename:'Beleg-'+belegNo(sl)+'.pdf',data:blob});toast('PDF gespeichert')}
    catch(err){var cd=err&&err.code;if(cd==='declined')return;toast(err&&err.message==='nolib'?'PDF-Baustein konnte nicht geladen werden':'PDF konnte nicht gespeichert werden')}
    return;
  }
  if(a==='cat'){S.open[t.dataset.key]=!S.open[t.dataset.key];return render()}
  if(a==='chipx'){e.stopPropagation();return setQty(id,(S.cart[id]||0)-1)}
  if(a==='chip')return setQty(id,(S.cart[id]||0)+1);
  if(a==='chipdel')return setQty(id,0);
  if(a==='disc'){var v=+t.dataset.v;S.disc=(!S.customDisc&&S.disc===v)?0:v;S.customDisc=false;return render()}
  if(a==='disccustom'){S.customDisc=!S.customDisc;S.disc=0;return render()}
  if(a==='finish'){
    var c=calc();if(!c.lines.length)return;
    var sale={id:uid('s'),ts:Date.now(),seller:S.me.id,sellerName:S.me.display,customer:S.customer.trim(),lines:c.lines,disc:S.disc,sub:c.sub,total:c.total,count:c.count};
    save('sales',sale.id,strip(sale));S.done=sale;
    toast('Verkauf über '+gn(c.total)+' gespeichert');
    S.cart={};S.disc=0;S.customDisc=false;S.customer='';return render();
  }
  if(a==='delsale'&&canManage()){if(S.confirm===id){S.confirm='';return remove('sales',id)}S.confirm=id;return render()}
  if(a==='noteadd'){var l=val('nl'),tx=val('nt');if(!l||!tx)return toast('Bezeichnung und Beschreibung ausfüllen');var ie=document.getElementById('ni');return save('notes',uid('n'),{label:l,text:tx,important:!!(ie&&ie.checked),ts:Date.now()}).then(function(){toast('Notiz gespeichert')})}
  if(a==='noteimp'&&canManage()){var n=S.data.notes.filter(function(x){return x.id===id})[0];return save('notes',id,Object.assign(strip(n),{important:!n.important}))}
  if(a==='notedel'&&canManage())return remove('notes',id);
  if(a==='notecopy'){var n2=S.data.notes.filter(function(x){return x.id===id})[0];try{navigator.clipboard.writeText(n2.text).then(function(){toast('Kopiert')},function(){toast('Kopieren nicht möglich')})}catch(x){toast('Kopieren nicht möglich')}return}
  if(!canManage())return;
  if(a==='pricesave'){
    var ps=[];document.querySelectorAll('.vk').forEach(function(i){var v=parseFloat(i.value);if(!isNaN(v)&&v>=0&&v!==priceOf(i.dataset.id))ps.push(save('prices',i.dataset.id,{price:v}))});
    return Promise.all(ps).then(function(){toast(ps.length?'Preise gespeichert':'Keine Änderungen')});
  }
  if(a==='pricereset'){return Promise.all(S.data.prices.map(function(p){return remove('prices',p.id)})).then(function(){toast('Standardpreise gesetzt')})}
  if(a==='staffadd'){
    var u=normUser(val('nu')),d=val('nd'),pw=val('np');
    if(!/^[a-z0-9._-]{2,30}$/.test(u))return toast('Benutzername: 2–30 Zeichen, a–z, Ziffern, . _ -');
    if(!d)return toast('Anzeigename eingeben');
    if(pw.length<6)return toast('Passwort: mindestens 6 Zeichen');
    if(memberById('u_'+u))return toast('Diesen Benutzernamen gibt es schon');
    try{var cr=await makeCred(pw);await save('members','u_'+u,{username:u,display:d,rank:+document.getElementById('nr').value,active:true,salt:cr.salt,hash:cr.hash,ts:Date.now()});toast('Mitarbeiter angelegt')}catch(x){toast('Anlegen nicht möglich')}
    return;
  }
  if(a==='staffpw'){
    var np=val('pw-'+id);if(np.length<6)return toast('Passwort: mindestens 6 Zeichen');
    try{var m=memberById(id),cr3=await makeCred(np);await save('members',id,Object.assign(strip(m),cr3));toast('Passwort gesetzt')}catch(x){toast('Setzen nicht möglich')}
    return;
  }
  if(a==='staffact'&&id!==S.me.id){var m2=memberById(id);return save('members',id,Object.assign(strip(m2),{active:m2.active===false}))}
  if(a==='staffdel'&&id!==S.me.id){if(S.confirm===id){S.confirm='';return remove('members',id)}S.confirm=id;return render()}
});
$main.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chip')){e.preventDefault();e.target.click()}
});
$main.addEventListener('input',function(e){
  var t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='customer')S.customer=t.value;
  else if(k==='qty'){var q=Math.max(0,Math.floor(parseFloat(t.value))||0);if(q)S.cart[t.dataset.id]=q;else delete S.cart[t.dataset.id];updateTotals()}
  else if(k==='cdisc'){var v=parseFloat(String(t.value).replace(',','.'));S.disc=isNaN(v)?0:Math.max(0,Math.min(100,v));rerenderKeep('cdisc')}
  else if(k==='q'){S.q=t.value;rerenderKeep('q')}
  else if(k==='filter'){S.filter=t.value;rerenderKeep('filter')}
});
$main.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.in==='qty'){render()}
  if(t.dataset.in==='rank'&&canManage()){
    var m=memberById(t.dataset.id),r=+t.value;if(!m)return;
    if(m.id===S.me.id&&r<MANAGE_RANK){toast('Du kannst dir den Rang Black Boss nicht selbst entziehen');return render()}
    save('members',m.id,Object.assign(strip(m),{rank:r})).then(function(){toast('Rang geändert')});
  }
});

var h0=(location.hash||'').replace('#','');if(VIEWS.some(function(v){return v[0]===h0}))S.view=h0;
render();
initDb();
})();
</script>

</body></html>
